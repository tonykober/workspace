<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FZG Google QA 連線測試</title>
<style>body{font:16px system-ui;background:#151820;color:#eee;max-width:650px;margin:50px auto;padding:24px}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #586177;background:#232938;color:#fff}button{margin-top:24px;background:#3654b9;cursor:pointer}p{line-height:1.7}#status{white-space:pre-wrap;color:#ffcf7e}</style>
<h1>FZG Google QA 連線測試</h1><p>連接新建的假資料測試表，驗證修改、刪除、排序、搬移，以及重新整理後讀回資料。請使用交付說明中的 QA 部署。</p>
<form id="connect"><label for="endpoint">QA Web App 網址（/exec）</label><input id="endpoint" type="url" required autocomplete="off"><label for="key">QA key（只填在此頁）</label><input id="key" type="password" required autocomplete="off"><button>檢查並開啟測試頁</button></form><p id="status" role="status"></p>
<script src="./tools/webqa-metadata.js"></script><script src="./tools/webqa-connection.js"></script><script src="./shared/data-utils.js"></script>
<script>document.getElementById('connect').onsubmit=async function(event){event.preventDefault();const button=this.querySelector('button'),status=document.getElementById('status');button.disabled=true;try{status.textContent='正在檢查 QA 部署與 key…';const connection=FzgWebQaConnection.validate(document.getElementById('endpoint').value,document.getElementById('key').value);const url=new URL(connection.url);url.searchParams.set('action','capabilities');const caps=await FzgData.checkedJson(fetch,url.href,{method:'GET'});FzgWebQaConnection.verifyCapabilities(caps);await FzgData.checkedJson(fetch,connection.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'qaRead',sheet:'notes',qaKey:connection.key})});sessionStorage.setItem('fzg_webqa_connection',JSON.stringify(connection));location.href='./art/';}catch(error){status.textContent='連線未完成：'+error.message+'。請保留錯誤訊息；瀏覽器連線／CORS 問題也會在這裡顯示。';}finally{button.disabled=false;}};</script></html>
